<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buyer Guide — SupplStore</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
</head>
<!--
  ISOLATION RULE: this page is intentionally frameless.
  No global navbar, no category pills, no 4-column footer —
  only the "Back to Catalog" link below. It does not load app.js;
  it fetches and renders its own content so it stays independent
  of the homepage.
-->
<body class="min-h-screen bg-[#F9F8F5] font-sans text-[#1A1A1A]">

  <div class="mx-auto max-w-2xl px-6 py-10">
    <a href="index.html"
       class="mb-8 inline-flex items-center gap-1.5 text-sm font-medium text-[#555555] hover:text-[#1A1A1A]">
      ← Back to Catalog
    </a>

    <div id="content">
      <div class="py-16 text-center text-sm text-[#8A8A84]">Loading buyer guide…</div>
    </div>
  </div>

  <script>
    function productArt(product) {
      const c = product.accentColor || "#1F3D2E";
      const shapes = {
        pouch: `
          <svg viewBox="0 0 160 200" class="h-full w-auto" role="img" aria-label="${product.name} package">
            <rect x="35" y="30" width="90" height="24" rx="10" fill="${c}" opacity="0.55"/>
            <rect x="25" y="50" width="110" height="140" rx="20" fill="${c}"/>
            <rect x="50" y="98" width="60" height="48" rx="8" fill="#FFFFFF" opacity="0.92"/>
          </svg>`,
        bottle: `
          <svg viewBox="0 0 160 200" class="h-full w-auto" role="img" aria-label="${product.name} bottle">
            <rect x="63" y="14" width="34" height="24" rx="5" fill="#33332F"/>
            <rect x="70" y="36" width="20" height="16" fill="${c}"/>
            <rect x="40" y="48" width="80" height="136" rx="16" fill="${c}"/>
            <rect x="50" y="96" width="60" height="48" rx="6" fill="#FFFFFF" opacity="0.92"/>
          </svg>`,
        jar: `
          <svg viewBox="0 0 160 200" class="h-full w-auto" role="img" aria-label="${product.name} jar">
            <rect x="33" y="24" width="94" height="24" rx="6" fill="#33332F"/>
            <rect x="28" y="46" width="104" height="134" rx="22" fill="${c}"/>
            <rect x="42" y="94" width="76" height="52" rx="8" fill="#FFFFFF" opacity="0.92"/>
          </svg>`,
        dropper: `
          <svg viewBox="0 0 160 200" class="h-full w-auto" role="img" aria-label="${product.name} dropper bottle">
            <rect x="62" y="8" width="36" height="32" fill="#2A2A28"/>
            <polygon points="58,40 102,40 92,62 68,62" fill="${c}"/>
            <rect x="45" y="62" width="70" height="122" rx="14" fill="${c}"/>
            <rect x="55" y="102" width="50" height="44" rx="6" fill="#FFFFFF" opacity="0.92"/>
          </svg>`,
      };
      return shapes[product.shape] || shapes.bottle;
    }

    (async function loadGuide() {
      const content = document.getElementById("content");
      const id = new URLSearchParams(window.location.search).get("product");

      let products = [];
      try {
        const res = await fetch("data/products.json");
        products = await res.json();
      } catch (err) {
        content.innerHTML = `
          <div class="py-16 text-center">
            <h1 class="mb-2 font-serif text-2xl font-bold">Couldn't load this guide</h1>
            <p class="mx-auto max-w-sm text-sm text-[#555555]">
              If the address bar shows <span class="font-mono text-xs">file://...</span>,
              your browser is blocking the local data fetch. Serve this folder through a
              local server, or deploy it (e.g. to Netlify), then reload.
            </p>
          </div>`;
        return;
      }

      const product = products.find((p) => p.id === id);

      if (!product) {
        content.innerHTML = `
          <div class="py-16 text-center">
            <h1 class="mb-2 font-serif text-2xl font-bold">Guide not found</h1>
            <p class="text-sm text-[#555555]">We couldn't find a buyer guide for "${id ?? ""}".</p>
          </div>`;
        return;
      }

      const art = product.image
        ? `<img src="${product.image}" alt="${product.name}" class="max-h-full">`
        : productArt(product);

      content.innerHTML = `
        <span class="text-xs font-semibold uppercase tracking-wide text-[#A9793C]">${product.category}</span>
        <h1 class="mb-6 mt-1 font-serif text-3xl font-bold sm:text-4xl">${product.name}</h1>

        <div class="rounded-3xl border border-[#ECE7DA] bg-white p-8 shadow-[0_2px_14px_rgba(26,26,26,0.04)]">
          <div class="mb-6 flex h-48 items-center justify-center">${art}</div>
          <p class="mb-1 font-mono text-[11px] text-[#9A9A94]">${product.subdomain}</p>
          <h2 class="mb-2 font-serif text-lg font-bold">Quick audit overview</h2>
          <p class="mb-8 leading-relaxed text-[#555555]">${product.summary}</p>

          <a href="${product.affiliateUrl}" target="_blank" rel="noopener noreferrer nofollow"
             class="block rounded-full bg-[#1F3D2E] px-6 py-3.5 text-center text-sm font-semibold text-white transition-colors hover:bg-[#16301F] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1F3D2E]">
            Claim Official Discount / Visit Official Page ↗
          </a>
        </div>

        <p class="mt-6 text-center text-xs text-[#8A8A84]">
          This is an independent buyer's guide. SupplStore may earn a commission if you purchase through the link above.
        </p>`;
    })();
  </script>
</body>
</html>
